name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject public Telegram relay URL into config.js
        env:
          TELEGRAM_RELAY_URL: ${{ vars.TELEGRAM_RELAY_URL }}
        run: |
          if [ -n "$TELEGRAM_RELAY_URL" ]; then
            sed -i "s|__TELEGRAM_RELAY_URL__|$TELEGRAM_RELAY_URL|g" config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
